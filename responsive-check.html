<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive check</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#dedbd3;font-family:system-ui;color:#222}h1{margin:0 0 18px;font-size:18px}.grid{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}.case{background:#f7f4ed;padding:10px;border-radius:14px;box-shadow:0 5px 18px #0002}.name{font-size:11px;font-weight:700;margin-bottom:8px}.viewport{position:relative;overflow:hidden;border-radius:18px;background:#fff}.viewport iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
</style></head><body><h1 id="title">Ticket Archive · responsive layouts</h1><main class="grid" id="grid"></main><script>
const query=new URLSearchParams(location.search);const scale=Math.min(.5,Math.max(.2,Number(query.get('scale'))||.42));const output=query.get('screen')==='output';if(output)document.getElementById('title').textContent+=' · Ticket Output';const devices=[
 ['Small phone',320,568,20,0],['Standard iPhone',390,844,47,34],['iPhone 16 Pro',402,874,59,34],['Large phone',430,932,59,34],['Android tall',412,915,24,24]
];const grid=document.getElementById('grid');for(const [name,w,h,top,bottom] of devices){const card=document.createElement('section');card.className='case';card.innerHTML=`<div class="name">${name} · ${w} × ${h}</div><div class="viewport" style="width:${w*scale}px;height:${h*scale}px"><iframe title="${name}" src="/?simulatedDevice=${encodeURIComponent(name)}&safeTop=${top}&safeBottom=${bottom}&case=${w}${output?'&previewScreen=TicketOutput':''}" style="width:${w}px;height:${h}px;transform:scale(${scale})"></iframe></div>`;grid.appendChild(card)}
</script></body></html>
